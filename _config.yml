# Site settings
title: "AIR-FM: Assessing and Improving Reliability of Foundation Models in the Real World Workshop@AAAI 2026"
url: "https://llmrel.github.io"
baseurl: "" # the subpath of your site, e.g. /blog

# Workshop specific settings
date_text: "<span style='color: white;'>January, 2026</span>"
date: "January 26th, 2026"
where: "<span style='color: white;'>AAAI 2026, Singapore EXPO</span>"
location: "AAAI 2026, Singapore EXPO"

# Build settings
destination: _site
paginate: 10
permalink: /:year/:title/
markdown: kramdown
highlighter: rouge

sass:
    sass_dir: _sass
    style: compressed

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

plugins: ['jekyll-paginate']
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png', 'previous_years/', 'humans.txt', '_posts/', 'feed.xml', 'sitemap.xml', 'categories.md', 'tags.md', 'docker-compose.yml']

# GitHub Pages settings
github: [metadata]
